<svg xmlns="http://www.w3.org/2000/svg" viewBox="170 200 684 620"><defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#454b52"/>
      <stop offset="1" stop-color="#2a2e33"/>
    </linearGradient>
    <linearGradient id="top" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1b5a4b"/>
      <stop offset="1" stop-color="#0f3a31"/>
    </linearGradient>
    <linearGradient id="cu" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f5ad6c"/>
      <stop offset="1" stop-color="#d98640"/>
    </linearGradient>
    <linearGradient id="hd" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#65778a"/>
      <stop offset="1" stop-color="#4b5b6a"/>
    </linearGradient>
    <linearGradient id="sv" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#a3adb5"/>
      <stop offset=".5" stop-color="#c3cbd1"/>
      <stop offset="1" stop-color="#98a3ac"/>
    </linearGradient>
    <radialGradient id="gl" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#ffd9ae" stop-opacity="1"/>
      <stop offset=".35" stop-color="#f5ad6c" stop-opacity=".75"/>
      <stop offset="1" stop-color="#f5ad6c" stop-opacity="0"/>
    </radialGradient>
  </defs><g id="mark" transform="translate(0 52)">
    <!-- slab sides (printed layers) -->
    <polygon points="212,503 512,676 512,740 212,567" fill="#0b2b24"/>
    <polygon points="512,676 812,503 812,567 512,740" fill="#08201b"/>

    <!-- slab top -->
    <polygon points="512,330 812,503 512,676 212,503" fill="url(#top)"/>
    <polygon points="512,330 812,503 512,676 212,503" fill="none" stroke="#2dd4a8" stroke-width="7" stroke-linejoin="round" stroke-opacity=".85"/>

    <!-- trace shadows -->
    <g fill="none" stroke="#06241c" stroke-width="28" stroke-linecap="round" stroke-linejoin="round">
      <path d="M356,494 L440,543 L530,491 L632,550"/>
      <path d="M440,543 L518,588"/>
      <path d="M530,491 L608,446"/>
    </g>
    <g fill="#06241c">
      <ellipse cx="356" cy="494" rx="46" ry="26"/>
      <ellipse cx="632" cy="550" rx="46" ry="26"/>
      <ellipse cx="518" cy="588" rx="46" ry="26"/>
      <ellipse cx="608" cy="446" rx="46" ry="26"/>
    </g>

    <!-- copper tape traces -->
    <g fill="none" stroke="url(#cu)" stroke-width="28" stroke-linecap="round" stroke-linejoin="round">
      <path d="M356,482 L440,531 L530,479 L632,538"/>
      <path d="M440,531 L518,576"/>
      <path d="M530,479 L608,434"/>
    </g>
    <g fill="none" stroke="#ffd2a3" stroke-opacity=".5" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M356,476 L440,525 L530,473 L632,532"/>
      <path d="M440,525 L518,570"/>
      <path d="M530,473 L608,428"/>
    </g>

    <!-- pads with holes -->
    <g fill="url(#cu)">
      <ellipse cx="356" cy="482" rx="46" ry="26"/>
      <ellipse cx="632" cy="538" rx="46" ry="26"/>
      <ellipse cx="518" cy="576" rx="46" ry="26"/>
      <ellipse cx="608" cy="434" rx="46" ry="26"/>
    </g>
    <g fill="#0d1115">
      <ellipse cx="356" cy="482" rx="17" ry="9.5"/>
      <ellipse cx="632" cy="538" rx="17" ry="9.5"/>
      <ellipse cx="518" cy="576" rx="17" ry="9.5"/>
      <ellipse cx="608" cy="434" rx="17" ry="9.5"/>
    </g>

    <!-- printhead shadow on the board -->
    <ellipse cx="614" cy="448" rx="36" ry="13" fill="#000" fill-opacity=".28"/>

    <!-- 3D printer head -->
    <g id="head">
      <!-- carriage -->
      <polygon points="538,196 678,196 708,179 568,179" fill="#7f93a5"/>
      <polygon points="678,196 708,179 708,245 678,262" fill="#3a4854"/>
      <rect x="538" y="196" width="140" height="66" fill="url(#hd)"/>
      <rect x="538" y="196" width="140" height="6" fill="#2dd4a8" fill-opacity=".85"/>
      <circle cx="574" cy="231" r="15" fill="#141a20" stroke="#2dd4a8" stroke-opacity=".6" stroke-width="4"/>
      <circle cx="574" cy="231" r="4" fill="#2dd4a8" fill-opacity=".8"/>
      <rect x="604" y="222" width="56" height="8" rx="3" fill="#141a20" fill-opacity=".7"/>
      <rect x="604" y="238" width="38" height="8" rx="3" fill="#141a20" fill-opacity=".7"/>
      <!-- heat sink fins -->
      <rect x="600" y="262" width="16" height="64" fill="#4a5967"/>
      <g fill="#6d8093">
        <rect x="572" y="270" width="72" height="9" rx="2"/>
        <rect x="572" y="288" width="72" height="9" rx="2"/>
        <rect x="572" y="306" width="72" height="9" rx="2"/>
      </g>
      <!-- heater block -->
      <polygon points="573,326 643,326 661,316 591,316" fill="#d3dade"/>
      <polygon points="643,326 661,316 661,360 643,370" fill="#838e97"/>
      <rect x="573" y="326" width="70" height="44" fill="url(#sv)"/>
      <!-- nozzle -->
      <polygon points="590,370 626,370 614,414 602,414" fill="url(#sv)"/>
      <polygon points="590,370 626,370 622,382 594,382" fill="#6f7a83" fill-opacity=".45"/>
    </g>
  </g>
</svg>